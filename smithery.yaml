# Smithery configuration for Prefeitura CE Fortaleza: CPOM
# Schema: https://smithery.ai/docs/build/project-config
# Remote HTTP MCP — server hosted at https://api.mcp.ai/p_pref_ce_fortaleza_cpom

name: pref_ce_fortaleza_cpom-mcp
displayName: "Prefeitura CE Fortaleza: CPOM"
description: >
  Prefeitura CE Fortaleza: CPOM, consulta em fonte oficial. Hospedado pela plataforma, sem credenciais da plataforma, pague por consulta com crédito pré-pago.

version: 0.1.0
license: MIT
homepage: https://github.com/mcp-dir/pref_ce_fortaleza_cpom-mcp
repository: https://github.com/mcp-dir/pref_ce_fortaleza_cpom-mcp

tags:
  - pref_ce_fortaleza_cpom
  - brazil
  - horizontal
  - read-only

# Remote HTTP MCP — sem startCommand local (servidor já hospedado)
startCommand:
  type: http
  url: https://api.mcp.ai/p_pref_ce_fortaleza_cpom

auth:
  type: oauth2
  resourceMetadataUrl: https://api.mcp.ai/p_pref_ce_fortaleza_cpom/.well-known/oauth-protected-resource
  fallback:
    type: agent-auth
    description: >
      Para clientes sem OAuth 2.1. O agente expõe uma tool authenticate(token).
      Usuário gera o JWT em https://app.mcp.ai/agent-auth e cola no chat.
